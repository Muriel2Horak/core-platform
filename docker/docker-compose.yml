services:
  # 🌐 Nginx reverse proxy - SSL/HTTPS configuration
  nginx:
    image: nginx:alpine
    container_name: core-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:-core-platform.local}
    volumes:
      # Mount template and custom entrypoint for envsubst processing
      - ./nginx/nginx-ssl.conf.template:/etc/nginx/nginx-ssl.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/custom-entrypoint.sh:ro
      # 🔒 Updated to use new wildcard SSL certificates
      - ${SSL_VOLUME:-../ssl}:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      frontend:
        condition: service_healthy  # ✅ OPRAVENO: Čeká na frontend health check
      backend:
        condition: service_started
      bff:
        condition: service_started
      keycloak:
        condition: service_started
      grafana:
        condition: service_healthy  # ✅ FIX: Čeká na Grafana health check
    networks:
      core-net:
        ipv4_address: 172.18.0.20  # 🔒 Static IP for stable DNS resolution from Grafana
    restart: unless-stopped

  # 🗄️ Database
  db:
    image: postgres:16
    container_name: core-db
    environment:
      POSTGRES_USER: ${DB_INTERNAL_USERNAME}
      POSTGRES_PASSWORD: ${DB_INTERNAL_PASSWORD}
      POSTGRES_DB: ${DB_INTERNAL_NAME}
      # Core app database credentials
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_PASSWORD_FILE: ${DATABASE_PASSWORD_FILE:-}
      # Keycloak database credentials pro init skripty
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD_FILE: ${KEYCLOAK_DB_PASSWORD_FILE:-}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      # Grafana database credentials pro init skripty
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME}
      GRAFANA_DB_USERNAME: ${GRAFANA_DB_USERNAME}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GRAFANA_DB_PASSWORD_FILE: ${GRAFANA_DB_PASSWORD_FILE:-}
    volumes:
      - core_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/wal-archive:/var/lib/postgresql/wal-archive
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - core-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🗄️ PgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: core-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - core-net

  # 🏗️ Backend
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: core-backend
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # 🌐 DOMAIN pro všechny external URLs
      - DOMAIN=${DOMAIN:-core-platform.local}
      # 🔧 FIX: OIDC Configuration - INTERNAL Keycloak URL pro JWT validaci
      - OIDC_ISSUER_URI=${OIDC_ISSUER_URI:-https://keycloak:8443/realms/admin}
      - OIDC_JWK_SET_URI=https://keycloak:8443/realms/admin/protocol/openid-connect/certs
      - OIDC_API_AUDIENCE=api
      # 🔧 NEW: Internal Keycloak URL for JWT decoder to download JWK keys via Docker network
      - KEYCLOAK_INTERNAL_BASE_URL=https://keycloak:8443
      # 🔧 FIX: CORS origins - wildcard pro všechny subdomény
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - LOG_LEVEL=DEBUG
      - SPRING_PROFILES_ACTIVE=development
      # 🔐 Service Account Credentials
      - KEYCLOAK_ADMIN_CLIENT_ID=backend-admin-service
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM}
      - KEYCLOAK_TARGET_REALM=${KEYCLOAK_TARGET_REALM}
      - KEYCLOAK_ADMIN_BASE_URL=${KEYCLOAK_ADMIN_BASE_URL}
      # 🏢 MULTITENANCY Configuration
      - TENANCY_DEFAULT_TENANT_KEY=${TENANCY_DEFAULT_TENANT_KEY}
      - AUTH_JWT_TENANT_CLAIM=${AUTH_JWT_TENANT_CLAIM:-tenant}
      # 📅 KEYCLOAK BACKFILL Configuration
      - APP_KEYCLOAK_BACKFILL_ENABLED=${APP_KEYCLOAK_BACKFILL_ENABLED:-true}
      - APP_KEYCLOAK_BACKFILL_CRON=${APP_KEYCLOAK_BACKFILL_CRON:-0 25 3 * * *}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}  # 🔧 FIX: Přidáno "123" pro konzistenci s .env
      # 🔒 SSL Configuration for HTTPS communication with Keycloak
      - JAVA_OPTS=-Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS
      # 📊 Streaming & Kafka Configuration
      - STREAMING_ENABLED=${STREAMING_ENABLED:-false}
      - KAFKA_SERVERS=${KAFKA_SERVERS:-kafka:9092}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_SERVERS:-kafka:9092}  # Spring Boot standard naming
      - STREAMING_TOPIC_PREFIX=${STREAMING_TOPIC_PREFIX:-core}
      - STREAMING_SECURITY_MODE=${STREAMING_SECURITY_MODE:-PLAINTEXT}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-https://grafana.${DOMAIN}}
      # 📊 Grafana SSO Integration
      - GRAFANA_JWT_TTL=${GRAFANA_JWT_TTL:-300}  # Must match Keycloak access token lifespan (5 min)
      - GRAFANA_JWT_SECRET=${GRAFANA_JWT_SECRET}
      # 📊 Loki Configuration (aplikační logging přes Logback)
      - LOKI_URL=http://core-loki:3100/loki/api/v1/push
    volumes:
      # 🔒 Updated to use new wildcard SSL certificates
      - ../ssl:/etc/ssl/backend:ro
    # ✅ Docker logging driver VYPNUT - používáme aplikační logging (Logback + Loki4j)
    # Výhody:
    # - Funguje v K8s/cloud (neváže se na localhost)
    # - Lepší strukturované logy (JSON s MDC kontextem)
    # - Asynchronní batching (neblokuje aplikaci)
    # - Tenant context v každém logu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s  # 10 minut - backend má pomalý AspectJ weaving
    networks:
      - core-net
    restart: unless-stopped

  # 🧩 BFF (Backend-for-Frontend) - GraphQL aggregator
  bff:
    build:
      context: ../bff
      dockerfile: Dockerfile
    container_name: core-bff
    environment:
      - NODE_ENV=production
      - PORT=${BFF_PORT:-4000}
      - BFF_BACKEND_URL=${BFF_BACKEND_URL:-http://backend:8080}
      - REDIS_URL=${BFF_REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BFF_TENANT_CLAIM=${BFF_TENANT_CLAIM:-tenant}
      - BFF_DEFAULT_TENANT=${BFF_DEFAULT_TENANT:-default}
      - BFF_BACKEND_TIMEOUT_MS=${BFF_BACKEND_TIMEOUT_MS:-5000}
      - GRAPHQL_PLAYGROUND=${BFF_GRAPHQL_PLAYGROUND:-false}
    ports:
      - "${BFF_PORT:-4000}:4000"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 🛡️ Frontend - PRODUKČNÍ BUILD PRO DEV PARITY
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        STREAMING_ENABLED: ${STREAMING_ENABLED:-false}
        GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-https://grafana.${DOMAIN:-core-platform.local}}
        API_BASE_URL: /api
    container_name: core-frontend
    # NOTE: No volume mount - static files are baked into the image during build
    # For development with hot-reload, use: make dev-watch or docker compose watch
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_started
      loki:
        condition: service_started
    # ✅ Docker logging driver VYPNUT - frontend posílá logy přes HTTP API
    # Frontend má vlastní logger service který posílá logy do BE API endpoint
    # Backend pak forwarduje do Loki s tenant kontextem
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - core-net
    restart: unless-stopped

  # 🔐 Keycloak
  keycloak:
    build:
      context: ..
      dockerfile: docker/keycloak/Dockerfile
    image: core-platform/keycloak:local
    container_name: core-keycloak
    restart: unless-stopped
    ports:
      - "8081:8443" # 🔒 HTTPS port mapping
    environment:
      # 🔐 Admin credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      
      # 🗄️ Database Configuration - používá env proměnné místo hardcoded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      
      # 👥 Test User Credentials (DEVELOPMENT ONLY)
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD}
      
      # 🔑 Client Secrets for init-realm.sh
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      DOMAIN: ${DOMAIN:-core-platform.local}

      # 🔒 HTTPS Production Mode Configuration - OPRAVENO: dynamické hostname detection
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true" # � Enable HTTP for internal kcadm.sh communication
      KC_HTTPS_PORT: "8443" # 🔒 HTTPS port
      KC_HTTPS_CLIENT_AUTH: "none"
      # 🔒 SSL Certificate configuration
      KC_HTTPS_CERTIFICATE_FILE: /etc/ssl/keycloak/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/ssl/keycloak/key.pem

      # 🔗 Event listeners configuration - pouze jboss-logging
      KC_EVENTS_LISTENERS: "jboss-logging"

      # 📊 Logging and health
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      KC_HEALTH_ENABLED: "true"

    volumes:
      - keycloak_data:/opt/keycloak/data
      # 🔒 Updated to use new wildcard SSL certificates
      - ../ssl:/etc/ssl/keycloak:ro

    # 🔒 Production HTTPS mode - removes dev mode
    # Note: CMD is defined in Dockerfile now

    networks:
      - core-net

  # 🏗️ Volitelná bootstrap služba pro automatické nastavení tenant realmů
  kc-bootstrap:
    image: core-platform/keycloak:local
    container_name: core-kc-bootstrap
    profiles:
      - bootstrap # Aktivuje se pouze s --profile bootstrap
    depends_on:
      keycloak:
        condition: service_started
    environment:
      # 📋 Bootstrap parametry
      - REALM=${AUTO_BOOTSTRAP_REALM:-}
      - TENANT_ADMIN=${AUTO_BOOTSTRAP_TENANT_ADMIN}
      - TENANT_ADMIN_PASSWORD=${AUTO_BOOTSTRAP_TENANT_ADMIN_PASSWORD}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BASE_URL=https://keycloak:8443
    volumes:
      - ../scripts:/scripts:ro
    command: >
      sh -c "
        if [ -z \"$$REALM\" ]; then
          echo '⚠️  AUTO_BOOTSTRAP_REALM not set, skipping bootstrap';
          exit 0;
        fi;
        echo '🏗️ Auto-bootstrapping realm: '$$REALM;
        echo '⏳ Waiting for Keycloak to be ready...';
        for i in \$$(seq 1 120); do
          if wget -q --spider https://keycloak:8443/health/ready 2>/dev/null; then
            break;
          fi;
          sleep 2;
        done;
        echo '✅ Keycloak is ready, starting bootstrap...';
        /scripts/kc_bootstrap_realm.sh;
        echo '🎉 Bootstrap completed, container will exit';
      "
    networks:
      - core-net
    restart: "no" # Spustí se pouze jednou

  # 📊 Monitoring Stack
  # 🔧 Grafana Tenant Provisioning Service
  grafana-provisioner:
    image: postgres:16
    container_name: core-grafana-provisioner
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=admin
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_INTERNAL_NAME:-core}
      - DB_USER=${DB_INTERNAL_USERNAME}
      - DB_PASSWORD=${DB_INTERNAL_PASSWORD}
      # ℹ️ TENANTS is now loaded dynamically from database (tenants table)
      # - TENANTS=admin test-tenant company-b  # DEPRECATED
    volumes:
      - ./grafana/provision-tenants.sh:/tmp/provision-tenants.sh:ro
    command: >
      sh -c "
        echo '⏳ Installing dependencies (curl, jq)...';
        apt-get update -qq && apt-get install -y -qq curl jq > /dev/null 2>&1;
        echo '✅ Dependencies installed';
        cp /tmp/provision-tenants.sh /usr/local/bin/provision-tenants.sh;
        chmod +x /usr/local/bin/provision-tenants.sh;
        /usr/local/bin/provision-tenants.sh;
        echo '🎉 Provisioning completed, container will exit';
      "
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - core-net
    restart: "no" # Spustí se pouze jednou

  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
      args:
        GRAFANA_VERSION: "11.3.0"
    image: core-grafana:11.3.0-custom
    container_name: core-grafana
    environment:
      # 🗄️ PostgreSQL Database (instead of SQLite for persistence across restarts)
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=db:5432
      - GF_DATABASE_NAME=${GRAFANA_DB_NAME:-grafana}
      - GF_DATABASE_USER=${GRAFANA_DB_USERNAME}
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD}
      - GF_DATABASE_SSL_MODE=disable
      
      # 🔐 OIDC SSO Configuration (Keycloak admin realm)
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana-ops
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://ops.${DOMAIN:-core-platform.local}/realms/admin/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://keycloak:8443/realms/admin/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://keycloak:8443/realms/admin/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE=true
      # Role mapping: groups claim → Grafana roles
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
      
      # 🔒 Security Settings
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      
      # ❌ JWT Auth DISABLED (no longer embedded in FE)
      - GF_AUTH_JWT_ENABLED=false
      
      # 🚫 CSP - Disable embedding (standalone tool)
      - GF_SECURITY_CONTENT_SECURITY_POLICY=true
      - GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE=frame-ancestors 'none'
      - GF_SECURITY_ALLOW_EMBEDDING=false
      
      # � Server Configuration (ops subdomain)
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=https://ops.${DOMAIN:-core-platform.local}/grafana
      
      # 🔄 Logout redirect
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://ops.${DOMAIN:-core-platform.local}/realms/admin/protocol/openid-connect/logout
      
      # 📂 Provisioning
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - core-net
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki:
    image: grafana/loki:3.0.0
    container_name: core-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml
      - loki_data:/loki
    networks:
      - core-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: core-promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
      - vault_audit:/var/log/vault:ro
    depends_on:
      - loki
    networks:
      - core-net
    user: "0:0"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: core-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - loki
      - promtail
    networks:
      - core-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: core-node-exporter
    ports:
      - "9100:9100"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - core-net
    profiles:
      - vm

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: core-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - core-net
    privileged: true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: core-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_INTERNAL_USERNAME}:${DB_INTERNAL_PASSWORD}@db:5432/${DB_INTERNAL_NAME}?sslmode=disable
    depends_on:
      - db
    networks:
      - core-net

  # 🔴 Redis for caching and presence (Phase 2)
  redis:
    image: redis:7-alpine
    container_name: core-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping || redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # � Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: apache/kafka:3.8.1
    container_name: core-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Performance & Storage settings
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Topic auto-creation disabled - we use TopicEnsurer
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Metrics for Prometheus
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - streaming

  # 🎛️ Kafka UI for management and monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: core-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: core-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - core-net
    profiles:
      - streaming

  # �📦 MinIO for document storage (Phase 2)
  minio:
    image: minio/minio:latest
    container_name: core-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 📊 Cube.js - Semantic Layer for Reporting
  cube:
    image: cubejs/cube:latest
    container_name: core-cube
    ports:
      - "${CUBE_PORT:-4000}:4000"
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=db
      - CUBEJS_DB_PORT=5432
      - CUBEJS_DB_NAME=${DB_INTERNAL_NAME:-core}
      - CUBEJS_DB_USER=${DB_INTERNAL_USERNAME}
      - CUBEJS_DB_PASS=${DB_INTERNAL_PASSWORD}
      - CUBEJS_API_SECRET=${CUBE_API_SECRET}
      - CUBEJS_DEV_MODE=${CUBE_DEV_MODE:-true}
      - CUBEJS_WEB_SOCKETS=true
      - CUBEJS_REDIS_URL=redis://redis:6379
      - CUBEJS_CACHE_AND_QUEUE_DRIVER=cubestore
      - NODE_ENV=${ENVIRONMENT:-development}
    volumes:
      - ./cube/schema:/cube/conf/schema:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/readyz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  core_db_data:
  grafana_data:
  loki_data:
  promtail_positions:
  prometheus_data:
  certbot-www:
  keycloak_data:
  redis_data:
  minio_data:
  kafka_data:


networks:
  core-net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-core-platform}-core-net
    ipam:
      config:
        - subnet: 172.30.0.0/16  # 🔒 Subnet for static IP assignment
          gateway: 172.30.0.1
